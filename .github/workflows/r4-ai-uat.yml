name: R4 AI External UAT

on:
  push:
    branches: [main]
    paths:
      - 'tests/r4_ai_uat.py'
      - '.github/workflows/r4-ai-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute R4 AI UAT
        run: python tests/r4_ai_uat.py
